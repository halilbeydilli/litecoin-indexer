name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build (Linux amd64)
        run: go build -o litecoin-indexer ./cmd/indexer

      - name: Cross-compile (Windows amd64)
        run: GOOS=windows GOARCH=amd64 go build -o litecoin-indexer.exe ./cmd/indexer
